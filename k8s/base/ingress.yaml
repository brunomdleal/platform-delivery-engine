# API Group & Version
apiVersion: networking.k8s.io/v1
# Defines external HTTP/S routing rules into cluster services
kind: Ingress
metadata:
  name: order-ingress
  labels:
    app.kubernetes.io/name: order-ingress
    app.kubernetes.io/part-of: platform-delivery-engine
  # Configures the underlying Nginx Ingress Controller running in the cluster.
  annotations:
    # Uses standard ingress-nginx controller
    kubernetes.io/ingress.class: nginx
    # Sends original host header and preserves client IP
    nginx.ingress.kubernetes.io/rewrite-target: "true"
spec:
  rules:
    - http:
        paths:
          # Backend API routing
          # Intercepts all requests beginning with /api (e.g., /api/v1/orders)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80
          # Frontend SPA routing
          # Intercepts all remaining requests
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-web-client
                port:
                  number: 80

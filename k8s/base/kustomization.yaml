# Glues all required files
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# List the relative file paths (order by dependencies)
resources:
  - deployment.yaml
  - service.yaml
  - order-web-client-deployment.yaml
  - order-web-client-service.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - ingress.yaml
# order-web-client DNS provider
apiVersion: v1
kind: Service
metadata:
  name: order-web-client
  labels:
    # Application name across the cluster, dashboards (Lens, ArgoCD, Kubernetes Dashboard), and log aggregators
    app.kubernetes.io/name: order-web-client
    # Identifies the higher-level system or portfolio this service belongs to
    app.kubernetes.io/part-of: platform-delivery-engine
spec:
  # Restricts network reachability strictly to internal pods inside the Kubernetes cluster
  type: ClusterIP
  # Routes inbound traffic arriving at the Service directly to Pods labeled app: order-web-client
  selector:
    app: order-web-client
  ports:
    - name: order-web-client
      # Listens
      port: 80
      # Talks
      targetPort: 8080
      protocol: TCP
      
services:
  order-service:
    image: ghcr.io/brunomdleal/order-service:${IMAGE_TAG:-0.0.4}
    container_name: order-service
    ports:
      - "${ORDER_SERVICE_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
